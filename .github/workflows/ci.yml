name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # stellar-cli version used for WASM builds. Keep in sync with docs/DEPLOYMENT.md.
  STELLAR_CLI_VERSION: "21.4.1"

jobs:
  contracts:
    name: Build & test Soroban contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain 1.81.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Run unit tests using the host (native) target — no network, no stellar-cli needed.
      # Tests use Soroban's in-process simulator (Env::default()) and mock_all_auths().
      - name: Run contract unit tests
        run: cargo test --workspace

      # Install stellar-cli to drive the optimised WASM builds.
      # Using cargo install is slowish but reliable; the cargo cache above helps.
      - name: Install stellar-cli ${{ env.STELLAR_CLI_VERSION }}
        run: cargo install --locked stellar-cli --version ${{ env.STELLAR_CLI_VERSION }}

      # stellar contract build compiles to wasm32-unknown-unknown with the
      # correct release profile and soroban-specific flags.
      - name: Build reputation-contract to WASM
        run: stellar contract build --package reputation-contract

      - name: Build bounty-contract to WASM
        run: stellar contract build --package bounty-contract

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm

  frontend:
    name: Build & test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc -b

      - name: Run frontend tests (9 tests)
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          # Empty contract IDs → demo mode during CI build.
          # Real IDs are injected via Vercel environment variables at deploy time.
          VITE_BOUNTY_CONTRACT_ID: ""
          VITE_REPUTATION_CONTRACT_ID: ""
