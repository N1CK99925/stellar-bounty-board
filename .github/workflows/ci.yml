name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Build & test Soroban contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml in the repo root pins the exact channel, so
      # dtolnay/rust-toolchain reads it automatically.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run contract unit tests
        run: cargo test --workspace

      - name: Install stellar-cli (for optimized WASM builds)
        run: cargo install --locked stellar-cli --version 21.4.1 2>/dev/null || true

      - name: Build contracts to WASM (release)
        run: |
          stellar contract build --package reputation-contract
          stellar contract build --package bounty-contract

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm

  frontend:
    name: Build & test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          # Use empty contract IDs so demo-mode is active during build;
          # the real IDs are injected at Vercel deployment time.
          VITE_BOUNTY_CONTRACT_ID: ""
          VITE_REPUTATION_CONTRACT_ID: ""
