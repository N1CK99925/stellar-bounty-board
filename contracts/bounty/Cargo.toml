[package]
name = "bounty-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=20.3.0"
# default-features = false disables reputation-contract's `contract` feature,
# so only the ReputationContractClient type (via #[contractclient]) is compiled
# — no #[no_mangle] WASM exports that would collide with bounty-contract's own
# entry points ("symbol multiply defined" linker error).
reputation-contract = { path = "../reputation", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "=20.3.0", features = ["testutils"] }
# testutils implies `contract`, giving tests access to the full ReputationContract
# struct needed for env.register_contract() in the test harness.
reputation-contract = { path = "../reputation", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
