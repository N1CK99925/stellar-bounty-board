[package]
name = "reputation-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=20.3.0"

[dev-dependencies]
soroban-sdk = { version = "=20.3.0", features = ["testutils"] }

[features]
# default: build the full contract (for `stellar contract build` of this package).
default = ["contract"]
# contract: includes #[contract] struct + #[contractimpl] exports.
# Disabled when bounty-contract uses reputation-contract as a library dep
# (via default-features = false) to prevent duplicate WASM symbol errors.
contract = []
# testutils: implies `contract` so tests can register the full implementation.
testutils = ["soroban-sdk/testutils", "contract"]
